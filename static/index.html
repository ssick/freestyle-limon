<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freestyle Limón</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#F4D03F">
<style>
  body { font-family: sans-serif; text-align: center; margin: 0; background: #FFFDF3; }
  header {
    background: linear-gradient(180deg, #F9E27A, #F4D03F);
    padding: 1.5rem 1rem;
    margin-bottom: 3rem;
    border-radius: 0 0 16px 16px;
  }
  header h1 { color: #5C4A00; margin: 0; font-size: 1.75rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
  header svg { height: 84px; width: 84px; }
  #lemon-digits { font-family: 'Courier New', monospace; }
  #value { font-size: 4rem; }
  #timestamp { color: #666; }
</style>
</head>
<body>
  <header>
    <h1>
      Freestyle
      <svg id="lemon-graphic" viewBox="0 0 100 100" role="img" aria-label="lemon glucose display">
        <defs>
          <linearGradient id="lemonGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F9E27A"/>
            <stop offset="100%" stop-color="#F4D03F"/>
          </linearGradient>
        </defs>
        <ellipse cx="50" cy="56" rx="34" ry="40" fill="url(#lemonGradient)"/>
        <path d="M46 16 Q50 6 54 16 Q50 20 46 16 Z" fill="#6FAE4B"/>
        <path d="M54 14 Q66 10 62 20 Q54 22 54 14 Z" fill="#4C8C3B"/>
        <rect x="27" y="46" width="46" height="26" rx="4" fill="#B9C4B3" stroke="#8B9A8B" stroke-width="1.5"/>
        <text id="lemon-digits" x="50" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#2f6f2f">--</text>
      </svg>
      Limón
    </h1>
  </header>
  <div id="value">waiting for first reading&hellip;</div>
  <div id="timestamp"></div>

  <script>
    async function poll() {
      try {
        const res = await fetch('/api/latest');
        const data = await res.json();

        if (data.status === 'ok') {
          const color = data.is_high ? 'orange' : data.is_low ? 'red' : 'green';

          const valueEl = document.getElementById('value');
          valueEl.textContent = `${data.value} mg/dL ${data.trend ?? ''}`;
          valueEl.style.color = color;

          const digitsEl = document.getElementById('lemon-digits');
          digitsEl.textContent = data.value;
          digitsEl.style.fill = color;

          document.getElementById('timestamp').textContent = data.timestamp
            ? `measured at ${new Date(data.timestamp).toLocaleTimeString()}`
            : '';
          document.title = `${data.value} mg/dL · Freestyle Limón`;
        }
      } catch (err) {
        console.error('Failed to poll /api/latest', err);
      }
    }

    poll();
    setInterval(poll, 30000);
  </script>
</body>
</html>
