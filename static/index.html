<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freestyle Limón</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#F4D03F">
<style>
  body { font-family: sans-serif; text-align: center; margin: 0; }
  header { background: #111; padding: 1.5rem 1rem; margin-bottom: 3rem; }
  header h1 { color: #F4D03F; margin: 0; font-size: 1.75rem; }
  header img { height: 1.5em; vertical-align: middle; margin-right: 0.5rem; }
  #value { font-size: 4rem; }
  #timestamp { color: #666; }
</style>
</head>
<body>
  <header>
    <h1><img src="/static/favicon.png" alt="">Freestyle Limón</h1>
  </header>
  <div id="value">waiting for first reading&hellip;</div>
  <div id="timestamp"></div>

  <script>
    async function poll() {
      try {
        const res = await fetch('/api/latest');
        const data = await res.json();

        if (data.status === 'ok') {
          const valueEl = document.getElementById('value');
          valueEl.textContent = `${data.value} mg/dL ${data.trend ?? ''}`;
          valueEl.style.color = data.is_high ? 'orange' : data.is_low ? 'red' : 'green';
          document.getElementById('timestamp').textContent = data.timestamp
            ? `measured at ${new Date(data.timestamp).toLocaleTimeString()}`
            : '';
          document.title = `${data.value} mg/dL · Freestyle Limón`;
        }
      } catch (err) {
        console.error('Failed to poll /api/latest', err);
      }
    }

    poll();
    setInterval(poll, 30000);
  </script>
</body>
</html>
