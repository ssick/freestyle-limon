<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freestyle Limón Widget</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  .lemon-wrap { position: relative; width: 160px; height: 160px; margin: 10px auto; }
  .lemon-wrap img { width: 100%; height: 100%; display: block; }
  #lemon-screen {
    position: absolute;
    left: 32.02%; top: 37.59%; width: 36.43%; height: 22.85%;
    border-radius: 6% / 9%;
    background: #c7c9a4;
    display: flex; align-items: center; justify-content: center;
  }
  #lemon-digits { font-family: 'Courier New', monospace; font-weight: 700; font-size: 1.6rem; line-height: 1; }
</style>
</head>
<body>
  <span class="lemon-wrap">
    <img src="/static/lemon.svg" alt="">
    <span id="lemon-screen"><span id="lemon-digits">--</span></span>
  </span>

  <script>
    function statusColor(isHigh, isLow) {
      return isHigh ? 'orange' : isLow ? 'red' : 'green';
    }

    async function poll() {
      try {
        const res = await fetch('/api/latest');
        const data = await res.json();

        const digitsEl = document.getElementById('lemon-digits');
        if (data.status === 'ok') {
          digitsEl.textContent = data.value;
          digitsEl.style.color = statusColor(data.is_high, data.is_low);
        }
      } catch (err) {
        console.error('Failed to poll /api/latest', err);
      }
    }

    poll();
    setInterval(poll, 30000);
  </script>
</body>
</html>
