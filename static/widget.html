<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Freestyle Limón Widget</title>
<style>
  @font-face {
    font-family: 'DSEG7Classic';
    src: url('/static/fonts/DSEG7Classic-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'DSEG7Classic';
    src: url('/static/fonts/DSEG7Classic-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  .lemon-wrap { display: block; position: relative; width: 123px; height: 160px; margin: 10px auto; }
  .lemon-wrap img { width: 100%; height: 100%; display: block; }
  #lemon-screen {
    position: absolute;
    left: 24.24%; top: 38.95%; width: 52.73%; height: 22.79%;
    border-radius: 6% / 9%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  #lemon-digits { font-family: 'DSEG7Classic', 'Courier New', monospace; font-weight: 700; font-size: 1.6rem; line-height: 1; }
</style>
</head>
<body>
  <span class="lemon-wrap">
    <img src="/static/lemon.svg" alt="">
    <span id="lemon-screen"><span id="lemon-digits">--</span></span>
  </span>

  <script>
    function statusColor(isHigh, isLow) {
      return isHigh ? 'orange' : isLow ? 'red' : 'green';
    }

    const VIEW_ORDER = ['value', 'trend'];
    let currentView = 'value';
    let lastData = null;

    function renderValue() {
      const digitsEl = document.getElementById('lemon-digits');
      if (lastData) {
        digitsEl.textContent = lastData.value;
        digitsEl.style.color = statusColor(lastData.is_high, lastData.is_low);
      } else {
        digitsEl.textContent = '--';
      }
    }

    function renderTrend() {
      const digitsEl = document.getElementById('lemon-digits');
      if (lastData && lastData.trend) {
        digitsEl.textContent = lastData.trend;
        digitsEl.style.color = statusColor(lastData.is_high, lastData.is_low);
      } else {
        digitsEl.textContent = '--';
      }
    }

    function render() {
      if (currentView === 'trend') renderTrend();
      else renderValue();
    }

    function cycleView() {
      const idx = VIEW_ORDER.indexOf(currentView);
      currentView = VIEW_ORDER[(idx + 1) % VIEW_ORDER.length];
      render();
    }

    let hasReading = false;
    const POLL_INTERVAL_MS = 30000;
    const RETRY_INTERVAL_MS = 2000;

    async function poll() {
      try {
        const res = await fetch('/api/latest');
        const data = await res.json();
        if (data.status === 'ok') {
          hasReading = true;
          lastData = data;
        }
        render();
      } catch (err) {
        console.error('Failed to poll /api/latest', err);
      } finally {
        setTimeout(poll, hasReading ? POLL_INTERVAL_MS : RETRY_INTERVAL_MS);
      }
    }

    document.getElementById('lemon-screen').addEventListener('click', cycleView);
    poll();
  </script>
</body>
</html>
